<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .profile-container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .profile-pic {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
        }
        h1 {
            color: #333;
        }
        p {
            color: #0d09eb;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <h1>Welcome to My Page</h1>

        <!-- Display Picture Section -->
        <img src="profile.jpeg" alt="My Profile Picture" class="profile-pic">

        <h2>About Me</h2>
        <p>My name is Harshavardhana R, and I am a web developer.</p>
        <p>This is a sample web page created for demonstration purposes.</p>
        <p> I Created this website with help of Naveen Bava.</p>
    </div>
</body>

</html>
